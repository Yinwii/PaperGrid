name: 构建并推送 Docker 镜像

on:
  push:
    tags:
      - "v*"
    branches:
      # main 的每次更新都会自动构建并把 latest 指向最新；版本标签只在推 v* 标签时发布
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    name: 构建并推送到 GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 解析镜像地址
        id: image
        run: |
          set -euo pipefail
          # 镜像始终推送到本仓库所属账号的命名空间（GHCR 要求全小写）。
          # fork 仓库（例如 Yinwii/PaperGrid）因此无需上游权限即可发布自己的镜像。
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          echo "IMAGE=ghcr.io/${OWNER}/papergrid" >> "$GITHUB_ENV"
          echo "image=ghcr.io/${OWNER}/papergrid" >> "$GITHUB_OUTPUT"
          echo "本次镜像地址: ghcr.io/${OWNER}/papergrid"

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 计算版本标签并校验一致性
        id: meta
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          if [[ -z "${VERSION}" ]]; then
            echo "未能读取应用版本号" >&2
            exit 1
          fi

          TAG_VERSION="${VERSION}"
          if [[ "${TAG_VERSION}" != v* ]]; then
            TAG_VERSION="v${TAG_VERSION}"
          fi

          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            if [[ "${GITHUB_REF_NAME:-}" != "${TAG_VERSION}" ]]; then
              echo "Git 标签与 package.json 版本不一致: tag=${GITHUB_REF_NAME}, 期望=${TAG_VERSION}" >&2
              exit 1
            fi
            echo "已校验 Git 标签与 package.json 一致: ${TAG_VERSION}"
          else
            echo "当前触发类型不是 tag，跳过标签一致性校验（ref_type=${GITHUB_REF_TYPE:-unknown}, ref_name=${GITHUB_REF_NAME:-unknown}）"
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag_version=${TAG_VERSION}" >> "$GITHUB_OUTPUT"
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi
          echo "使用版本: ${TAG_VERSION}"

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 用本地脚本构建镜像
        env:
          IMAGE: ${{ env.IMAGE }}
        run: ./scripts/build-image.sh

      - name: 验证镜像首次启动与旧数据升级
        env:
          IMAGE: ${{ env.IMAGE }}:${{ steps.meta.outputs.tag_version }}
        run: node scripts/test-image-startup.mjs

      - name: 推送版本标签
        # 仅在推 v* 标签（正式发布）时发布版本号标签
        if: steps.meta.outputs.is_release == 'true'
        env:
          IMAGE: ${{ env.IMAGE }}
          TAG_VERSION: ${{ steps.meta.outputs.tag_version }}
        run: docker push "${IMAGE}:${TAG_VERSION}"

      - name: 推送 latest 标签
        # 无论分支还是标签构建，latest 始终指向最新一次成功构建
        env:
          IMAGE: ${{ env.IMAGE }}
        run: docker push "${IMAGE}:latest"

      - name: 推送 edge 标签（分支构建）
        # 分支构建额外打一个 edge 标签，便于区分“未发布版本”
        if: steps.meta.outputs.is_release != 'true'
        env:
          IMAGE: ${{ env.IMAGE }}
        run: |
          docker tag "${IMAGE}:latest" "${IMAGE}:edge"
          docker push "${IMAGE}:edge"
